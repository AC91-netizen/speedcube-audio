<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tactile Speedcube Audio Tutorial</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main>


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>

        <h1>Tactile Speedcube</h1>

        <p>
            Accessible Audio Tutorial
        </p>

    </header>



    <!-- =================================================
         AUDIO PLAYER
         ================================================= -->

    <section aria-labelledby="player-heading">


        <h2 id="player-heading">
            Audio controls
        </h2>


        <!--
            The MP3 file must be named:
            speedcube-tutorial.mp3
        -->

        <audio
            id="audioPlayer"
            preload="metadata"
            aria-label="Tactile Speedcube complete audio tutorial">

            <source
                src="speedcube-tutorial.mp3"
                type="audio/mpeg">

            Your browser does not support audio playback.

        </audio>



        <!-- =================================================
             PLAY
             ================================================= -->

        <button
            type="button"
            id="playButton"
            aria-label="Play the speedcube tutorial after a five second delay">

            PLAY AUDIO

        </button>



        <!-- =================================================
             PAUSE
             ================================================= -->

        <button
            type="button"
            id="pauseButton"
            aria-label="Pause the speedcube tutorial">

            PAUSE AUDIO

        </button>



        <!-- =================================================
             REWIND / FAST FORWARD
             ================================================= -->

        <div class="small-controls">


            <button
                type="button"
                id="rewindButton"
                aria-label="Rewind the audio 10 seconds">

                REWIND 10 SECONDS

            </button>


            <button
                type="button"
                id="forwardButton"
                aria-label="Fast forward the audio 10 seconds">

                FAST FORWARD 10 SECONDS

            </button>


        </div>



        <!-- =================================================
             PLAYBACK SPEED
             ================================================= -->

        <section
            aria-labelledby="speed-heading"
            class="speed-section">


            <h2 id="speed-heading">
                Playback speed
            </h2>


            <p>
                Choose how fast the tutorial is spoken.
            </p>



            <div class="speed-buttons">


                <button
                    type="button"
                    class="speed-button"
                    data-speed="0.5"
                    aria-label="Playback speed half speed">

                    0.5 times

                </button>



                <button
                    type="button"
                    class="speed-button"
                    data-speed="0.75"
                    aria-label="Playback speed three quarters speed">

                    0.75 times

                </button>



                <button
                    type="button"
                    class="speed-button selected"
                    data-speed="1"
                    aria-label="Playback speed normal speed">

                    1 times

                </button>



                <button
                    type="button"
                    class="speed-button"
                    data-speed="1.25"
                    aria-label="Playback speed one and a quarter times">

                    1.25 times

                </button>



                <button
                    type="button"
                    class="speed-button"
                    data-speed="1.5"
                    aria-label="Playback speed one and a half times">

                    1.5 times

                </button>



                <button
                    type="button"
                    class="speed-button"
                    data-speed="1.75"
                    aria-label="Playback speed one and three quarters times">

                    1.75 times

                </button>



                <button
                    type="button"
                    class="speed-button"
                    data-speed="2"
                    aria-label="Playback speed double speed">

                    2 times

                </button>


            </div>



            <p
                id="speedStatus"
                role="status"
                aria-live="polite">

                Playback speed is normal.

            </p>


        </section>



        <!-- =================================================
             STATUS MESSAGE
             ================================================= -->

        <p
            id="status"
            role="status"
            aria-live="polite">

            Audio ready.

        </p>


    </section>



    <!-- =================================================
         CHAPTERS
         ================================================= -->

    <section aria-labelledby="chapters-heading">


        <h2 id="chapters-heading">
            Tutorial chapters
        </h2>


        <p>
            Select a chapter to jump to that section.
            Audio will begin five seconds after selecting a chapter.
        </p>



        <div class="chapters">


            <!-- CHAPTER 0 -->

            <button
                type="button"
                class="chapter"
                data-time="0"
                aria-label="Chapter 0, Introduction, starting at zero minutes. Audio will start after five seconds.">

                Chapter 0 — Introduction

            </button>



            <!-- CHAPTER 1 -->

            <button
                type="button"
                class="chapter"
                data-time="36"
                aria-label="Chapter 1, Learning Your Cube, starting at 36 seconds. Audio will start after five seconds.">

                Chapter 1 — Learning Your Cube

            </button>



            <!-- CHAPTER 2 -->

            <button
                type="button"
                class="chapter"
                data-time="92"
                aria-label="Chapter 2, Finding the Starting Position, starting at 1 minute 32 seconds. Audio will start after five seconds.">

                Chapter 2 — Finding the Starting Position

            </button>



            <!-- CHAPTER 3 -->

            <button
                type="button"
                class="chapter"
                data-time="130"
                aria-label="Chapter 3, Understanding a Turn, starting at 2 minutes 10 seconds. Audio will start after five seconds.">

                Chapter 3 — Understanding a Turn

            </button>



            <!-- CHAPTER 4 -->

            <button
                type="button"
                class="chapter"
                data-time="181"
                aria-label="Chapter 4, The First Cross, starting at 3 minutes 1 second. Audio will start after five seconds.">

                Chapter 4 — The First Cross

            </button>



            <!-- CHAPTER 5 -->

            <button
                type="button"
                class="chapter"
                data-time="250"
                aria-label="Chapter 5, Making the Circle Cross, starting at 4 minutes 10 seconds. Audio will start after five seconds.">

                Chapter 5 — Making the Circle Cross

            </button>



            <!-- CHAPTER 6 -->

            <button
                type="button"
                class="chapter"
                data-time="334"
                aria-label="Chapter 6, Solving the Circle Corners, starting at 5 minutes 34 seconds. Audio will start after five seconds.">

                Chapter 6 — Solving the Circle Corners

            </button>



            <!-- CHAPTER 7 -->

            <button
                type="button"
                class="chapter"
                data-time="410"
                aria-label="Chapter 7, The Middle Layer, starting at 6 minutes 50 seconds. Audio will start after five seconds.">

                Chapter 7 — The Middle Layer

            </button>



            <!-- CHAPTER 8 -->

            <button
                type="button"
                class="chapter"
                data-time="518"
                aria-label="Chapter 8, The Diagonal Face, starting at 8 minutes 38 seconds. Audio will start after five seconds.">

                Chapter 8 — The Diagonal Face

            </button>



            <!-- CHAPTER 9 -->

            <button
                type="button"
                class="chapter"
                data-time="552"
                aria-label="Chapter 9, Creating the Diagonal Cross, starting at 9 minutes 12 seconds. Audio will start after five seconds.">

                Chapter 9 — Creating the Diagonal Cross

            </button>



            <!-- CHAPTER 10 -->

            <button
                type="button"
                class="chapter"
                data-time="593"
                aria-label="Chapter 10, Positioning the Diagonal Corners, starting at 9 minutes 53 seconds. Audio will start after five seconds.">

                Chapter 10 — Positioning the Diagonal Corners

            </button>



            <!-- CHAPTER 11 -->

            <button
                type="button"
                class="chapter"
                data-time="645"
                aria-label="Chapter 11, Turning the Final Corners, starting at 10 minutes 45 seconds. Audio will start after five seconds.">

                Chapter 11 — Turning the Final Corners

            </button>



            <!-- CHAPTER 12 -->

            <button
                type="button"
                class="chapter"
                data-time="708"
                aria-label="Chapter 12, The Final Edges, starting at 11 minutes 48 seconds. Audio will start after five seconds.">

                Chapter 12 — The Final Edges

            </button>



            <!-- CHAPTER 13 -->

            <button
                type="button"
                class="chapter"
                data-time="758"
                aria-label="Chapter 13, Checking the Speedcube, starting at 12 minutes 38 seconds. Audio will start after five seconds.">

                Chapter 13 — Checking the Speedcube

            </button>



            <!-- CHAPTER 14 -->

            <button
                type="button"
                class="chapter"
                data-time="812"
                aria-label="Chapter 14, If You Lose Your Orientation, starting at 13 minutes 32 seconds. Audio will start after five seconds.">

                Chapter 14 — If You Lose Your Orientation

            </button>



            <!-- CHAPTER 15 -->

            <button
                type="button"
                class="chapter"
                data-time="849"
                aria-label="Chapter 15, Final Reminder, starting at 14 minutes 9 seconds. Audio will start after five seconds.">

                Chapter 15 — Final Reminder

            </button>


        </div>

    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script>


/* =========================================================
   AUDIO ELEMENT
   ========================================================= */

const audio =
    document.getElementById("audioPlayer");



/* =========================================================
   MAIN BUTTONS
   ========================================================= */

const playButton =
    document.getElementById("playButton");


const pauseButton =
    document.getElementById("pauseButton");


const rewindButton =
    document.getElementById("rewindButton");


const forwardButton =
    document.getElementById("forwardButton");



/* =========================================================
   STATUS ELEMENTS
   ========================================================= */

const status =
    document.getElementById("status");


const speedStatus =
    document.getElementById("speedStatus");



/* =========================================================
   SPEED BUTTONS
   ========================================================= */

const speedButtons =
    document.querySelectorAll(".speed-button");



/* =========================================================
   CHAPTER BUTTONS
   ========================================================= */

const chapterButtons =
    document.querySelectorAll(".chapter");



/* =========================================================
   FIVE SECOND TIMER
   ========================================================= */

let startTimer = null;



/* =========================================================
   CANCEL EXISTING TIMER
   ========================================================= */

function cancelTimer() {

    if (startTimer !== null) {

        clearTimeout(startTimer);

        startTimer = null;

    }

}



/* =========================================================
   PLAY AFTER FIVE SECOND DELAY
   ========================================================= */

function playAfterDelay(message) {


    /* Cancel any previous timer */

    cancelTimer();


    /* Make sure the audio is paused */

    audio.pause();


    /* Tell TalkBack what is happening */

    status.textContent =
        message +
        " Audio will start in five seconds.";


    /* Start five second countdown */

    startTimer =
        setTimeout(
            function() {


                audio.play();


                status.textContent =
                    "Playing.";


                startTimer = null;


            },
            5000
        );

}



/* =========================================================
   PLAY BUTTON
   ========================================================= */

playButton.addEventListener(
    "click",
    function() {


        playAfterDelay(
            "Starting the speedcube tutorial."
        );


    }
);



/* =========================================================
   PAUSE BUTTON
   ========================================================= */

pauseButton.addEventListener(
    "click",
    function() {


        /* Cancel any pending countdown */

        cancelTimer();


        /* Pause audio */

        audio.pause();


        status.textContent =
            "Audio paused.";


    }
);



/* =========================================================
   REWIND 10 SECONDS
   ========================================================= */

rewindButton.addEventListener(
    "click",
    function() {


        /* Cancel pending countdown */

        cancelTimer();


        /* Move backwards */

        audio.currentTime =
            Math.max(
                0,
                audio.currentTime - 10
            );


        status.textContent =
            "Rewound 10 seconds.";


    }
);



/* =========================================================
   FAST FORWARD 10 SECONDS
   ========================================================= */

forwardButton.addEventListener(
    "click",
    function() {


        /* Cancel pending countdown */

        cancelTimer();


        /* Move forwards */

        audio.currentTime =
            Math.min(
                audio.duration || Infinity,
                audio.currentTime + 10
            );


        status.textContent =
            "Fast forwarded 10 seconds.";


    }
);



/* =========================================================
   PLAYBACK SPEED BUTTONS
   ========================================================= */

speedButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                /* Get selected speed */

                const speed =
                    Number(
                        button.getAttribute(
                            "data-speed"
                        )
                    );


                /* Change playback speed */

                audio.playbackRate =
                    speed;


                /* Remove selected state */

                speedButtons.forEach(
                    function(otherButton) {

                        otherButton.classList.remove(
                            "selected"
                        );

                    }
                );


                /* Mark selected speed */

                button.classList.add(
                    "selected"
                );


                /* Create TalkBack-friendly message */

                let spokenSpeed;


                if (speed === 0.5) {

                    spokenSpeed =
                        "half speed";

                }

                else if (speed === 0.75) {

                    spokenSpeed =
                        "three quarters speed";

                }

                else if (speed === 1) {

                    spokenSpeed =
                        "normal speed";

                }

                else if (speed === 1.25) {

                    spokenSpeed =
                        "one and a quarter speed";

                }

                else if (speed === 1.5) {

                    spokenSpeed =
                        "one and a half speed";

                }

                else if (speed === 1.75) {

                    spokenSpeed =
                        "one and three quarters speed";

                }

                else if (speed === 2) {

                    spokenSpeed =
                        "double speed";

                }


                speedStatus.textContent =
                    "Playback speed is " +
                    spokenSpeed +
                    ".";


            }
        );

    }
);



/* =========================================================
   CHAPTER BUTTONS
   ========================================================= */

chapterButtons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                /* -----------------------------------------
                   STEP 1
                   CANCEL ANY EXISTING COUNTDOWN
                   ----------------------------------------- */

                cancelTimer();


                /* -----------------------------------------
                   STEP 2
                   IMMEDIATELY PAUSE CURRENT AUDIO
                   ----------------------------------------- */

                audio.pause();


                /* -----------------------------------------
                   STEP 3
                   GET CHAPTER START TIME
                   ----------------------------------------- */

                const time =
                    Number(
                        button.getAttribute(
                            "data-time"
                        )
                    );


                /* -----------------------------------------
                   STEP 4
                   JUMP TO CHAPTER
                   ----------------------------------------- */

                audio.currentTime =
                    time;


                /* -----------------------------------------
                   STEP 5
                   GET CHAPTER NAME
                   ----------------------------------------- */

                const chapterName =
                    button.textContent.trim();


                /* -----------------------------------------
                   STEP 6
                   TELL TALKBACK
                   ----------------------------------------- */

                status.textContent =
                    chapterName +
                    ". Audio paused. " +
                    "Audio will start in five seconds.";


                /* -----------------------------------------
                   STEP 7
                   WAIT FIVE SECONDS
                   ----------------------------------------- */

                startTimer =
                    setTimeout(
                        function() {


                            /* ---------------------------------
                               STEP 8
                               START AUDIO
                               --------------------------------- */

                            audio.play();


                            status.textContent =
                                "Playing " +
                                chapterName +
                                ".";


                            startTimer = null;


                        },
                        5000
                    );


            }
        );

    }
);



/* =========================================================
   AUDIO FINISHED
   ========================================================= */

audio.addEventListener(
    "ended",
    function() {


        cancelTimer();


        status.textContent =
            "The speedcube tutorial has finished.";


    }
);



/* =========================================================
   AUDIO ERROR
   ========================================================= */

audio.addEventListener(
    "error",
    function() {


        cancelTimer();


        status.textContent =
            "There was a problem playing the audio.";


    }
);


</script>


</body>

</html>
